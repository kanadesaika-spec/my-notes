name: Deploy Quartz site to GitHub Pages

# 手元でビルドした public/（暗号化済みの完成版）をそのまま公開する方式。
# ノートの元ファイル（content/起業ナレッジ）はこの公開リポジトリに入れないため、
# GitHub Actions 側ではビルドを行わず、コミット済みの public/ をアップロードするだけ。

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
